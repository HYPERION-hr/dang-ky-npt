<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hướng dẫn đăng ký người phụ thuộc</title>
<style>
  :root{
    --bg:#f5f7fb; --card:#fff; --ink:#1d2433; --muted:#5b6578; --line:#e1e6ef;
    --brand:#0f5fa8; --brand-soft:#e8f1fb; --accent:#d9691f; --warn-soft:#fff4e8;
    --ok:#1d8a56; --ok-soft:#e7f6ee; --bad:#b4372f; --bad-soft:#fdecea; --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.55}
  .wrap{max-width:980px;margin:0 auto;padding:20px 16px 48px}
  header{background:linear-gradient(135deg,#0f5fa8,#1c7fd0);color:#fff;border-radius:var(--radius);padding:22px 20px}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .brand .logo{background:#fff;border-radius:10px;padding:4px 8px;display:flex;align-items:center}
  .brand .logo img{height:64px;width:auto;display:block}
  header .org{font-size:12.5px;opacity:.85;letter-spacing:.4px;text-transform:uppercase}
  header h1{margin:6px 0 4px;font-size:22px;line-height:1.3}
  header p{margin:0;opacity:.92;font-size:14px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .stat{background:rgba(255,255,255,.15);border-radius:10px;padding:10px 12px}
  .stat b{display:block;font-size:20px}
  .stat span{font-size:12.5px;opacity:.9}
  nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
  nav a{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--brand);text-decoration:none;font-weight:600}
  h2{font-size:18px;margin:28px 0 8px;color:var(--brand)}
  .hint{color:var(--muted);font-size:13.5px;margin:0 0 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
  .tile{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;text-align:left;cursor:pointer;font:inherit;color:inherit;transition:border-color .15s,background .15s}
  .tile:hover{border-color:var(--brand)}
  .tile.active{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 3px rgba(15,95,168,.12)}
  .tile .ico{font-size:22px}
  .tile .name{display:block;font-weight:700;margin-top:4px}
  .tile .sub{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
  .panel,.box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .panel{margin-top:14px}
  .panel h3{margin:0 0 4px;font-size:18px}
  .who{color:var(--muted);font-size:13.5px;margin-bottom:14px}
  .cond{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
  .cond>div{background:var(--ok-soft);border-radius:10px;padding:10px 12px}
  .cond small{display:block;color:var(--ok);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px}
  .cond ul{margin:0;padding-left:18px}
  .label{font-weight:700;font-size:14px;margin:16px 0 6px;color:var(--brand)}
  ul.docs{margin:0;padding-left:20px}
  ul.docs li{margin:3px 0}
  .forms{display:flex;flex-direction:column;gap:8px}
  .form{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
  .form .t{font-weight:700;font-size:14px}
  .form .c{font-size:12px;color:var(--brand);font-weight:600}
  .form .d{color:var(--muted);font-size:12.5px}
  .btn{flex-shrink:0;background:var(--brand);color:#fff;text-decoration:none;font-size:13px;font-weight:700;padding:8px 14px;border-radius:8px;white-space:nowrap}
  .btn.off{background:#c3c9d4;pointer-events:none}
  .note{border-left:4px solid var(--accent);background:var(--warn-soft);border-radius:8px;padding:10px 12px;font-size:13.5px;margin-top:12px}
  .note.info{border-left-color:var(--brand);background:var(--brand-soft)}
  .empty{color:var(--muted);text-align:center;padding:24px 10px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
  th{background:var(--brand);color:#fff;font-weight:600}
  td:first-child{font-weight:600;background:#f8fafd}
  .tablewrap{overflow-x:auto}
  .checker{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end}
  .checker label{font-size:12.5px;color:var(--muted);font-weight:600;display:block;margin-bottom:4px}
  .checker select,.checker input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
  .result{margin-top:12px;border-radius:10px;padding:12px 14px;font-size:14px;display:none}
  .result.in{display:block;background:var(--bad-soft);border-left:4px solid var(--bad)}
  .result.out{display:block;background:var(--ok-soft);border-left:4px solid var(--ok)}
  .steps{counter-reset:s;list-style:none;padding:0;margin:0}
  .steps li{counter-increment:s;position:relative;padding:4px 0 12px 42px}
  .steps li::before{content:counter(s);position:absolute;left:0;top:2px;width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
  .box ul{margin:0;padding-left:20px}
  .box li{margin:4px 0}
  .contact{display:flex;flex-wrap:wrap;gap:8px 20px}
  .contact a{color:var(--brand);font-weight:600;text-decoration:none}
  details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px}
  details summary{cursor:pointer;font-weight:700}
  details ul{margin:8px 0 0;padding-left:20px}
  footer{color:var(--muted);font-size:12.5px;margin-top:26px;border-top:1px solid var(--line);padding-top:12px}
  @media (max-width:620px){
    .wrap{padding:8px 6px 28px}
    header{padding:16px 14px}
    header h1{font-size:19px}
    .brand .logo img{height:46px}
    .stat b{font-size:16px}
    .panel,.box{padding:14px 12px}
    .grid{grid-template-columns:1fr 1fr;gap:8px}
    .tile{padding:10px 10px}
    .tile .ico{font-size:18px}
    .tile .name{font-size:14px}
    .cond{grid-template-columns:1fr}
    .checker{grid-template-columns:1fr 1fr}
    .form{flex-direction:column;align-items:flex-start}
  }
</style>
</head>

  // Lộ trình tuổi nghỉ hưu (NĐ 135/2020, điều kiện bình thường), đơn vị: tháng
  const tuoiNghiHuu = (gt, nam) => gt === "nam"
    ? 60*12 + 3 + Math.min(Math.max(nam-2021,0), 7) * 3
    : 55*12 + 4 + Math.min(Math.max(nam-2021,0), 15) * 4;
  const fmtTuoi = m => Math.floor(m/12) + " tuổi" + (m%12 ? " " + (m%12) + " tháng" : "");

  const thangDuTuoi = (gt, y, m) => {

    for (let t = b; t < b + 80*12; t++) if (t - b >= tuoiNghiHuu(gt, Math.floor(t/12))) return t;

    const gt = document.getElementById("gt").value;

    } else if (tx >= td) {
      kq.className="result out";
      kq.innerHTML = `<b>Ngoài độ tuổi lao động</b> – đã đủ tuổi nghỉ hưu (${fmtTuoi(tuoiNghiHuu(gt,Math.floor(td/12)))}) từ tháng ${fmtThang(td)}.<br>Chỉ cần thỏa điều kiện thu nhập bình quân ≤ 3 triệu đồng/tháng, không cần giấy giám định.`;
    } else {
      kq.className="result in";
      kq.innerHTML = `<b>Trong độ tuổi lao động</b> (hiện ${tuoiStr}; đủ tuổi nghỉ hưu vào tháng ${fmtThang(td)}).<br>Để đăng ký, NPT phải <b>không có khả năng lao động</b>: nộp kèm giấy giám định suy giảm khả năng lao động từ 81% trở lên, và thu nhập bình quân ≤ 3 triệu đồng/tháng.`;
    }
  };
  ["gt","bm","by","xet"].forEach(id=>document.getElementById(id).addEventListener("change",check));
  check();
})();
</script>
</body>
</html>
